# Publishes the browser game to GitHub Pages: builds the TypeScript, then copies index.html, the compiled game and the
# game's pictures and dialogue (game/typescript/build-site.py) into one folder. In the repository's settings, set
# Pages > Source to "GitHub Actions".
name: Publish the game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: game/typescript
        run: |
          npm install
          npx tsc
          python3 build-site.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/typescript/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
